<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dino Rush Evrim</title>
<style>
:root{--bg:#0b0e1c;--panel:rgba(16,20,42,.9);--line:rgba(255,255,255,.14);--txt:#f4f6ff;--mut:#9aa6cf;--acc:#ffc233;--good:#4ee38c;--bad:#ff5468;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a2150,#0b0e1c)}
#stage{position:relative;overflow:hidden;background:#000;font-size:16px}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
.coin-ico{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffc233 55%,#d98a00);box-shadow:inset 0 0 0 .12em #b86a00}
.btn{background:linear-gradient(180deg,#ffd45a,#ff9f1c);color:#2a1700;font-weight:800;padding:.7em 1.4em;border-radius:999px;box-shadow:0 .25em 0 #b86a00,0 .6em 1.2em rgba(0,0,0,.35);letter-spacing:.04em;transition:transform .08s}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #b86a00}
.btn.sec{background:linear-gradient(180deg,#434b82,#2a3058);color:var(--txt);box-shadow:0 .25em 0 #151a34,0 .6em 1.2em rgba(0,0,0,.3)}
.btn.sec:active{box-shadow:0 .1em 0 #151a34}
.btn.big{font-size:1.55em;padding:.55em 2.2em}
.btn.sm{font-size:.85em;padding:.55em 1em}
.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.9em;padding:1em;z-index:5}
.screen.show{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#menu{background:linear-gradient(180deg,rgba(5,8,25,.6),rgba(5,8,25,.1) 45%,rgba(5,8,25,.55))}
#pause,#over{background:rgba(5,8,25,.62);backdrop-filter:blur(3px)}
#shop,#ach,#set{background:rgba(5,8,25,.72);backdrop-filter:blur(4px);z-index:6}
.logo{font-weight:900;font-size:4em;letter-spacing:.05em;line-height:.95;text-align:center;background:linear-gradient(180deg,#fff,#ffd45a 55%,#ff7a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .06em 0 rgba(0,0,0,.5))}
.sub{color:#dfe6ff;font-size:.8em;letter-spacing:.18em;text-align:center;opacity:.9}
.pills{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.pill{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:99px;padding:.35em .9em;font-weight:700;font-size:.95em}
.btns{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.hint{font-size:.78em;color:#cfd8ff;text-align:center;line-height:1.7;opacity:.85;max-width:38em}
kbd{background:rgba(255,255,255,.16);border-radius:.4em;padding:.05em .45em;font:inherit;font-weight:700}
.card{width:min(34em,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:1.2em;box-shadow:0 1em 3em rgba(0,0,0,.55);overflow:hidden}
.card header{display:flex;align-items:center;gap:.6em;padding:.75em 1em;border-bottom:1px solid var(--line);font-weight:800;font-size:1.05em}
.card header .t{flex:1}
.wal{font-size:.9em;background:rgba(0,0,0,.35);border-radius:99px;padding:.2em .8em}
.x{width:2em;height:2em;border-radius:50%;background:rgba(255,255,255,.12);font-weight:800}
.card .body{overflow:auto;padding:.8em;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:.4em;padding:.6em .8em 0}
.tab{flex:1;background:rgba(255,255,255,.07);padding:.55em;border-radius:.7em;font-weight:700;color:var(--mut)}
.tab.on{background:var(--acc);color:#2a1700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6em,1fr));gap:.6em}
.item{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:.9em;padding:.6em;text-align:center;font-size:.9em;display:flex;flex-direction:column;align-items:center;gap:.35em}
.item.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.item canvas{width:5.6em;height:5.6em}
.item b{font-size:1.02em}
.row{display:flex;gap:.7em;align-items:center;padding:.65em;border-radius:.85em;background:rgba(255,255,255,.05);margin-bottom:.5em}
.row.done{background:rgba(78,227,140,.13)}
.row .ic{font-size:1.6em;width:1.4em;text-align:center}
.row .tx{flex:1;min-width:0}
.row .tx small{display:block;color:var(--mut);font-size:.82em;margin-top:.1em}
.bar{height:.4em;background:rgba(255,255,255,.14);border-radius:9px;margin-top:.4em;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ee38c,#ffc233);width:0}
.pips{display:inline-flex;gap:.2em;margin-left:.4em;vertical-align:middle}
.pips i{width:.6em;height:.6em;border-radius:50%;background:rgba(255,255,255,.2)}
.pips i.on{background:var(--acc)}
.sw{width:3em;height:1.6em;border-radius:99px;background:#3a4170;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:.2em;left:.2em;width:1.2em;height:1.2em;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--good)}
.sw.on::after{left:1.6em}
#hud{position:absolute;inset:0;pointer-events:none;z-index:3;display:none;font-weight:900;text-shadow:0 .08em 0 rgba(0,0,0,.4)}
#stage[data-s=playing] #hud,#stage[data-s=paused] #hud,#stage[data-s=dead] #hud{display:block}
#hudL{position:absolute;left:max(.9em,env(safe-area-inset-left,0px));top:calc(.6em + env(safe-area-inset-top,0px))}
#score{font-size:2.3em;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1;transition:transform .15s}
#score.pulse{transform:scale(1.25);color:var(--acc)}
#best{font-size:.8em;opacity:.8;letter-spacing:.08em}
#hudR{position:absolute;right:max(.9em,env(safe-area-inset-right,0px));top:calc(.6em + env(safe-area-inset-top,0px));display:flex;gap:.6em;align-items:center;font-size:1.3em}
#pauseBtn{pointer-events:auto;width:2em;height:2em;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid var(--line);font-size:.8em;display:grid;place-items:center}
#chips{position:absolute;left:max(.9em,env(safe-area-inset-left,0px));top:calc(4.3em + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:.35em}
.chip{display:flex;align-items:center;gap:.5em;background:rgba(0,0,0,.45);border-radius:99px;padding:.22em .8em .22em .3em;font-size:.72em;min-width:9.5em;text-shadow:none}
.chip .ic{width:1.6em;height:1.6em;border-radius:50%;flex:none}
.chip .tm{flex:1;height:.4em;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.chip .tm b{display:block;height:100%}
#banner{position:absolute;left:0;right:0;top:21%;text-align:center;font-size:1.9em;letter-spacing:.12em;opacity:0;transform:scale(.9);transition:opacity .5s,transform .5s;text-shadow:0 .06em 0 rgba(0,0,0,.45),0 0 .6em rgba(0,0,0,.35)}
#banner.show{opacity:1;transform:none}
#tip{position:absolute;left:0;right:0;bottom:36%;text-align:center;font-size:.85em;opacity:0;transition:opacity .6s;text-shadow:0 .1em .3em #000}
#tip.show{opacity:.95}
#touch{position:absolute;left:0;right:0;bottom:0;height:40%;z-index:4;display:none;pointer-events:none}
body.touch #stage[data-s=playing] #touch{display:block}
.tb{position:absolute;bottom:max(.8em,env(safe-area-inset-bottom));width:4.6em;height:4.6em;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.45);pointer-events:auto;font-size:1.05em;color:#fff;display:grid;place-items:center;touch-action:none;box-shadow:0 .2em .8em rgba(0,0,0,.25)}
.tb.on{background:rgba(255,255,255,.4)}
#btnDuck{left:max(.8em,env(safe-area-inset-left,0px))}
#btnJump{right:max(.8em,env(safe-area-inset-right,0px))}
#toasts{position:absolute;left:0;right:0;top:.6em;display:flex;flex-direction:column;align-items:center;gap:.4em;z-index:9;pointer-events:none}
.toast{background:rgba(15,20,45,.94);border:1px solid var(--acc);padding:.5em 1.1em;border-radius:99px;font-weight:700;font-size:.9em;max-width:92%;text-align:center;animation:tin .35s ease,tout .4s ease 2.8s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-1em)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-1em)}}
.ttl{font-size:2em;font-weight:900;letter-spacing:.08em;text-align:center}
.bigscore{font-size:3.6em;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.newb{color:var(--acc);font-weight:900;letter-spacing:.15em;animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.35}}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;width:min(26em,100%)}
.sgrid div{background:rgba(255,255,255,.08);border-radius:.8em;padding:.5em;text-align:center;font-size:.85em;color:var(--mut)}
.sgrid b{display:block;color:var(--txt);font-size:1.25em}
#oAch{font-size:.85em;color:var(--good);text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="app">
<div id="stage" data-s="menu">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hudL"><div id="score">00000</div><div id="best">REKOR 00000</div></div>
    <div id="hudR"><span><i class="coin-ico"></i> <span id="coinN">0</span></span><button id="pauseBtn" aria-label="Duraklat">❚❚</button></div>
    <div id="chips"></div>
    <div id="banner"></div>
    <div id="tip"></div>
  </div>

  <div id="touch">
    <button class="tb" id="btnDuck" aria-label="Eğil">▼</button>
    <button class="tb" id="btnJump" aria-label="Zıpla">▲</button>
  </div>

  <div id="menu" class="screen show">
    <div class="logo">DINO<br>RUSH</div>
    <div class="sub">E V R İ M</div>
    <div class="pills"><span class="pill">🏆 Rekor <b id="mBest">0</b></span><span class="pill"><i class="coin-ico"></i> <b id="mCoins">0</b></span></div>
    <button class="btn big" id="bPlay">OYNA</button>
    <div class="btns">
      <button class="btn sec sm" id="bShop">🛒 Mağaza</button>
      <button class="btn sec sm" id="bAch">🏆 Başarımlar</button>
      <button class="btn sec sm" id="bSet">⚙️ Ayarlar</button>
    </div>
    <div class="hint" id="mHint"></div>
  </div>

  <div id="pause" class="screen">
    <div class="ttl">DURAKLATILDI</div>
    <button class="btn big" id="bResume">DEVAM</button>
    <div class="btns">
      <button class="btn sec sm" id="bRestart">🔄 Yeniden</button>
      <button class="btn sec sm" id="bPSet">⚙️ Ayarlar</button>
      <button class="btn sec sm" id="bPMenu">🏠 Menü</button>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="ttl">OYUN BİTTİ</div>
    <div class="newb" id="oNew" style="display:none">★ YENİ REKOR ★</div>
    <div class="bigscore" id="oScore">0</div>
    <div class="sgrid">
      <div>Rekor<b id="oBest">0</b></div>
      <div>Jeton<b id="oCoins">0</b></div>
      <div>Bölge<b id="oBiome">-</b></div>
    </div>
    <div id="oAch"></div>
    <button class="btn big" id="bAgain">TEKRAR</button>
    <div class="btns">
      <button class="btn sec sm" id="bOShop">🛒 Mağaza</button>
      <button class="btn sec sm" id="bShare">📤 Paylaş</button>
      <button class="btn sec sm" id="bOMenu">🏠 Menü</button>
    </div>
  </div>

  <div id="shop" class="screen">
    <div class="card">
      <header><span class="t">🛒 Mağaza</span><span class="wal"><i class="coin-ico"></i> <b id="shopCoins">0</b></span><button class="x" data-close>✕</button></header>
      <div class="tabs"><button class="tab on" id="tabSkins">Kostümler</button><button class="tab" id="tabUps">Yükseltmeler</button></div>
      <div class="body" id="shopBody"></div>
    </div>
  </div>

  <div id="ach" class="screen">
    <div class="card">
      <header><span class="t">🏆 Başarımlar <small id="achSum" style="color:var(--mut);font-weight:600"></small></span><button class="x" data-close>✕</button></header>
      <div class="body" id="achBody"></div>
    </div>
  </div>

  <div id="set" class="screen">
    <div class="card">
      <header><span class="t">⚙️ Ayarlar</span><button class="x" data-close>✕</button></header>
      <div class="body" id="setBody"></div>
    </div>
  </div>

  <div id="toasts"></div>
</div>
</div>
<script>
(()=>{'use strict';
/* ================= YARDIMCILAR ================= */
const $=s=>document.querySelector(s),TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ================= KAYIT ================= */
const KEY='dinorush_evrim_v1';
const defSave=()=>({best:0,coins:0,owned:['classic'],skin:'classic',up:{dj:0,pt:0,ss:0},
  stats:{runs:0,jumps:0,coins:0,birds:0,near:0,pu:0,rocket:0,dist:0,maxBiome:0},ach:{},
  set:{sfx:true,music:true,vib:true,fx:true},tips:0});
let save=defSave();
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r){const d=defSave();save=Object.assign(d,r);save.up=Object.assign(defSave().up,r.up);save.stats=Object.assign(defSave().stats,r.stats);save.set=Object.assign(defSave().set,r.set)}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ================= VERİLER ================= */
const BIOMES=[
 {n:'ÇÖL',e:'🏜️',sT:'#4aa8e0',sB:'#ffe0ae',far:'#e3a870',mid:'#d9b27c',gr:'#ecce93',gd:'#cfa86b',ln:'#a9854a',cl:'#ffffff',jag:.15,amp:1,star:0,w:'dust'},
 {n:'ORMAN',e:'🌲',sT:'#5db8e6',sB:'#d9f2dc',far:'#6fae92',mid:'#4f9a68',gr:'#7cc46c',gd:'#4f8f46',ln:'#34702d',cl:'#ffffff',jag:.5,amp:1.1,star:0,w:'rain'},
 {n:'KAR DİYARI',e:'❄️',sT:'#9cc9ee',sB:'#eef8ff',far:'#b9d0e4',mid:'#a2bfd6',gr:'#f2f8ff',gd:'#cddfec',ln:'#9bb8d0',cl:'#ffffff',jag:1.2,amp:1.3,star:0,w:'snow'},
 {n:'VOLKAN',e:'🌋',sT:'#3a1520',sB:'#ff8040',far:'#3a1a1e',mid:'#2a1316',gr:'#52352f',gd:'#2c1a1a',ln:'#ff7a2e',cl:'#5a3b3b',jag:1.5,amp:1.4,star:.15,w:'ember'},
 {n:'UZAY',e:'🚀',sT:'#05031a',sB:'#2d1b69',far:'#3b2d80',mid:'#2a2060',gr:'#40377a',gd:'#221c4b',ln:'#9a86ff',cl:'#6c5bd0',jag:.8,amp:1.2,star:1,w:'star'}];
const PK=['sT','sB','far','mid','gr','gd','ln','cl'];
BIOMES.forEach(b=>{b.c={};PK.forEach(k=>b.c[k]=hex(b[k]))});

const SKINS=[
 {id:'classic',n:'Klasik',cost:0,body:'#6c7a86',belly:'#cfd8de',acc:'#46525c',dark:'#4f5b66',item:'none'},
 {id:'forest',n:'Ormancı',cost:60,body:'#4caf50',belly:'#d3efa5',acc:'#2e7d32',dark:'#36883a',item:'cap'},
 {id:'ice',n:'Buz Adam',cost:120,body:'#5ec8e8',belly:'#e8fbff',acc:'#2b7a9e',dark:'#3ea5c6',item:'shades'},
 {id:'lava',n:'Lav',cost:200,body:'#e8512f',belly:'#ffb36b',acc:'#7a1f0b',dark:'#bb3a1c',item:'flame'},
 {id:'ninja',n:'Ninja',cost:300,body:'#2d2f3a',belly:'#4d5063',acc:'#e53935',dark:'#1d1f27',item:'band'},
 {id:'unicorn',n:'Tekboynuz',cost:450,body:'#ff8fc1',belly:'#fff1f8',acc:'#ffd34e',dark:'#e46aa2',item:'horn'},
 {id:'robot',n:'Robot',cost:650,body:'#aab4c0',belly:'#e8edf2',acc:'#00d2ee',dark:'#818c99',item:'antenna'},
 {id:'king',n:'Altın Kral',cost:1000,body:'#f2b705',belly:'#fff1a6',acc:'#e08c00',dark:'#c99200',item:'crown'}];
const UPS=[
 {id:'dj',n:'Çift Zıplama',d:'Havadayken bir kez daha zıplayabilirsin.',ic:'⤊',cost:[400]},
 {id:'pt',n:'Güçlü Bonuslar',d:'Her seviyede bonuslar %25 daha uzun sürer.',ic:'⚡',cost:[150,300,550]},
 {id:'ss',n:'Kalkanla Başla',d:'Her koşuya 8 saniyelik kalkanla başla.',ic:'🛡️',cost:[250]}];
const PU={shield:{n:'KALKAN',c:'#52b6ff',t:15},magnet:{n:'MIKNATIS',c:'#ff5468',t:10},slow:{n:'YAVAŞ ZAMAN',c:'#b78bff',t:6},x2:{n:'2X PUAN',c:'#ffc233',t:10},rocket:{n:'ROKET',c:'#ff7a3d',t:4.5}};
const PUK=Object.keys(PU);

let run={};
const newRun=()=>({coins:0,birds:0,near:0,pu:0,rocket:0,jumps:0,streak:0,maxStreak:0,newAch:[]});
const life=k=>(save.stats[k]||0)+(run[k]||0);
let curScore=()=>0; // oyun durumu tanımlandıktan sonra bağlanır
const ACH=[
 {id:'a1',ic:'👣',n:'İlk Adım',d:'Bir koşuda 100 puan yap',r:10,p:()=>curScore()/100},
 {id:'a2',ic:'🏃',n:'Koşucu',d:'Bir koşuda 500 puan yap',r:25,p:()=>curScore()/500},
 {id:'a3',ic:'🏅',n:'Maraton',d:'Bir koşuda 1500 puan yap',r:60,p:()=>curScore()/1500},
 {id:'a4',ic:'👑',n:'Efsane',d:'Bir koşuda 3000 puan yap',r:150,p:()=>curScore()/3000},
 {id:'a5',ic:'💰',n:'Para Avcısı',d:'Tek koşuda 40 jeton topla',r:30,p:()=>run.coins/40},
 {id:'a6',ic:'🏦',n:'Zengin',d:'Toplam 500 jeton topla',r:80,p:()=>life('coins')/500},
 {id:'a7',ic:'🦅',n:'Kuş Avcısı',d:'30 pterodaktili geç',r:40,p:()=>life('birds')/30},
 {id:'a8',ic:'😅',n:'Kıl Payı',d:'20 yakın geçiş yap',r:50,p:()=>life('near')/20},
 {id:'a9',ic:'⚡',n:'Güç Toplayıcı',d:'25 bonus topla',r:50,p:()=>life('pu')/25},
 {id:'a10',ic:'🌋',n:'Volkan Gezgini',d:'Volkan bölgesine ulaş',r:40,p:()=>Math.max(save.stats.maxBiome,run.biome||0)>=3?1:0},

let AC=null,master=null,noiseBuf=null;
function audioInit(){
 try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
   noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();
 }catch(e){AC=null}
}
function tone(f,d,type,v,slide,delay){
 if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fq,delay){
 if(!AC)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fq||800;g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);
}

 jump:()=>tone(330,.17,'square',.08,350),dj:()=>tone(520,.16,'square',.08,520),land:()=>noise(.07,.08,350),
 coin:()=>{tone(1046,.06,'square',.06);tone(1568,.12,'square',.06,0,.06)},
 power:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',.12,0,i*.06)),
 hit:()=>{noise(.5,.35,700);tone(150,.55,'sawtooth',.18,-110)},
 shield:()=>{tone(900,.28,'sine',.14,-600);noise(.15,.15,3000)},
 near:()=>tone(1250,.06,'square',.05),
 mile:()=>{tone(784,.08,'square',.07);tone(1175,.16,'square',.07,0,.09)},
 ach:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.15,'triangle',.13,0,i*.08)),
 thunder:()=>noise(1.4,.3,260),warn:()=>{tone(440,.1,'sawtooth',.05);tone(440,.1,'sawtooth',.05,0,.16)},
 boom:()=>{noise(.35,.3,500);tone(90,.3,'sine',.25,-40)},click:()=>tone(620,.04,'square',.05),
 rocket:()=>{noise(.6,.18,1800);tone(120,.6,'sawtooth',.1,300)},buy:()=>{tone(700,.08,'triangle',.12);tone(1050,.18,'triangle',.12,0,.08)}};

/* Müzik: bölgeye göre ton değiştiren küçük bir sekans */
const MUS={on:false,step:0,next:0},ROOTS=[45,41,48,43],TR=[0,2,-2,3,5],PAT=[0,1,2,3,2,1,2,1];
const mn=m=>440*Math.pow(2,(m-69)/12);
function musicUpdate(){
 if(!AC||!save.set.music||G.state!=='playing'){MUS.on=false;return}
 if(!MUS.on){MUS.on=true;MUS.next=AC.currentTime+.05;MUS.step=0}
 const bpm=104+clamp((G.speed-360)/440,0,1)*44,sd=60/bpm/2;
 while(MUS.next<AC.currentTime+.18){
  const s=MUS.step,bar=(s>>3)&3,k=s&7,r=ROOTS[bar]+TR[G.bA],t=MUS.next-AC.currentTime;
  if(k===0||k===3||k===4||k===6)tone(mn(r-12),sd*1.7,'triangle',.1,0,t);
  const ch=bar===0?[0,3,7,12]:[0,4,7,12];
  tone(mn(r+12+ch[PAT[k]]),sd*.9,'square',.022,0,t);
  if(k&1)noise(.03,.025,6000,t);
  MUS.next+=sd;MUS.step++;
 }
}

function envUpdate(){
 const ds=G.dist*.025,L=CFG.biomeLen,k=Math.floor(ds/L),f=ds-k*L,tz=60;
 G.bAbs=k;G.bA=k%5;G.bB=(k+1)%5;G.bT=f>L-tz?smooth((f-(L-tz))/tz):0;
 G.biome=G.bT>.5?G.bB:G.bA;
 const BW=G.BW;BW[0]=BW[1]=BW[2]=BW[3]=BW[4]=0;BW[G.bA]+=1-G.bT;BW[G.bB]+=G.bT;
 G.phase=(.92+ds/CFG.cycle)%1;
 const d=.5+.5*Math.cos(G.phase*TAU);G.night=d>.7?0:d<.3?1:smooth((.7-d)/.4);
 G.gravMul=lerp(1,.8,BW[4]);
}

function makeGround(x){
 const ds=G.dist*.025,n=Math.random()<.32+Math.min(.2,ds/3000)?rint(2,3):1,items=[];let cx=0;
 for(let i=0;i<n;i++){const w=rint(20,28),h=rint(34,62);items.push({dx:cx,w,h,s:Math.random()});cx+=w+rint(4,10)}
 const last=items[items.length-1],w=last.dx+last.w,h=Math.max(...items.map(i=>i.h));
 return {type:'ground',x,w,h,y:G.gy-h,items,passed:false,near:false,st:G.biome};
}
function makeBird(x){
 const r=Math.random(),cy=G.gy-(r<.25?14:r<.7?48:98);
 return {type:'bird',x,w:42,h:28,y:cy-14,vx:rnd(40,110),ph:rnd(0,TAU),passed:false,near:false};
}
function makeMeteor(){snd('warn');return {type:'meteor',state:'warn',t:0,ft:0,x:G.W-90,w:34,h:38,y:G.gy-38,passed:false,near:false}}
const mkCoin=(x,y)=>({x,y,spin:rnd(0,TAU),r:9});
function coinLine(x,y,n,gap){for(let i=0;i<n;i++)coinsA.push(mkCoin(x+i*gap,y))}
function coinArc(o){const n=5,cx=o.x+o.w/2,span=o.w+170,peak=Math.max(o.h+34,80);for(let i=0;i<n;i++){const u=i/(n-1);coinsA.push(mkCoin(cx+(u-.5)*span,G.gy-14-(peak-14)*(1-Math.pow(2*u-1,2))))}}
const PUPOOL=['shield','shield','magnet','magnet','slow','x2','x2','rocket'];
const makePower=(x,y)=>({type:PUPOOL[rint(0,PUPOOL.length-1)],x,y,by:y,t:0});

function spawnWave(){
 const ds=G.dist*.025,gy=G.gy,sp=G.speed,x=G.W+60,r=Math.random();
 let o,extra=0;
 if(ds>140&&r<.28)o=makeBird(x);
 else if(G.biome>=3&&ds>150&&r<.44){o=makeMeteor();extra=sp*.9}
 else o=makeGround(x);
 obs.push(o);
 const k=clamp(ds/1600,0,1),gap=sp*lerp(1,.78,k)+rnd(130,320)+o.w+extra;
 G.cd=gap;
 const q=Math.random();
 if(o.type==='ground'&&q<.5)coinArc(o);
 else if(q<.78)coinLine(x+gap*.35,gy-rint(22,26),rint(4,6),38);
 else if(q<.9)coinLine(x+gap*.35,gy-rint(92,108),rint(4,6),38);
 if(Math.random()<.14&&!pups.length)pups.push(makePower(x+gap*.55,gy-rint(60,100)));
}

const dinoBox=()=>{const fy=G.gy+dino.y;return dino.duck?{x:dino.x-17,y:fy-23,w:40,h:21}:{x:dino.x-11,y:fy-42,w:30,h:38}};
const obsBox=o=>o.type==='bird'?{x:o.x+6,y:o.y+6,w:o.w-12,h:o.h-12}:{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-4};
let achT=0;

function physics(rdt,dt){
 const gr=CFG.grav*G.gravMul,rocket=G.pu.rocket>0,fy=G.gy+dino.y;
 dino.duck=inp.duckHeld&&dino.onGround&&!rocket;
 if(dino.onGround)dino.coyote=.1;else dino.coyote-=rdt;
 if(inp.buf>0&&!rocket){
  if(dino.onGround||dino.coyote>0)doJump(false);
  else if(save.up.dj&&dino.jumps<2)doJump(true);
 }
 if(rocket){
  dino.y+=(-150-dino.y)*Math.min(1,5*dt);dino.vy=0;dino.onGround=false;dino.jumps=0;
  parts.push({x:dino.x-12,y:fy-14,vx:rnd(-160,-60),vy:rnd(-30,30),life:.4,max:.4,s:rnd(3,6),c:Math.random()<.5?'#ffb13b':'#ff5a2a',g:0});
 }else if(!dino.onGround){
  dino.vy+=gr*dt;
  if(inp.duckHeld&&dino.vy>-150)dino.vy+=4800*dt;
  if(!inp.jumpHeld&&dino.vy<CFG.cut)dino.vy=CFG.cut;
  dino.vy=Math.min(dino.vy,1500);dino.y+=dino.vy*dt;
  if(dino.y>=0){
   const hard=dino.vy>650;dino.y=0;dino.onGround=true;dino.jumps=0;
   if(hard){snd('land');G.shake=Math.max(G.shake,hard&&inp.duckHeld?6:2);for(let i=0;i<7;i++)parts.push({x:dino.x+rnd(-10,10),y:G.gy,vx:rnd(-120,120),vy:rnd(-70,-10),life:.4,max:.4,s:rnd(2,4),c:'rgba(210,190,150,.75)',g:200})}
  }
 }
 if(dino.onGround&&!rocket){G.dustT-=rdt;if(G.dustT<=0){G.dustT=.08;parts.push({x:dino.x-10,y:G.gy-1,vx:-G.speed*.3-rnd(0,40),vy:rnd(-30,-5),life:.35,max:.35,s:rnd(1.5,3),c:'rgba(210,190,150,.6)',g:40})}}
}

function update(rdt){
 syncInp();
 G.ts=lerp(G.ts,G.pu.slow>0?.62:1,Math.min(1,6*rdt));
 const dt=rdt*G.ts;G.t+=dt;inp.buf=Math.max(0,inp.buf-rdt);
 for(const k of PUK)if(G.pu[k]>0){const p=G.pu[k];G.pu[k]=Math.max(0,p-rdt);if(G.pu[k]===0&&k==='rocket'){G.grace=Math.max(G.grace,1.6)}}
 G.grace=Math.max(0,G.grace-rdt);
 const rocket=G.pu.rocket>0;
 physics(rdt,dt);

 G.speed=Math.min(CFG.max,G.speed+CFG.acc*dt);
 const adv=G.speed*dt;G.dist+=adv;addScore(adv*.025);
 envUpdate();
 run.biome=Math.max(run.biome||0,G.bAbs+(G.bT>.5?1:0));
 if(G.biome!==G.lastBiome){G.lastBiome=G.biome;showBanner(BIOMES[G.biome].e+'  '+BIOMES[G.biome].n)}
 const ms=Math.floor(G.score/100);if(ms>G.lastMile){G.lastMile=ms;snd('mile');pulseScore()}

 G.cd-=adv;if(G.cd<=0)spawnWave();
 if(rocket){G.rocketCd-=adv;if(G.rocketCd<=0){G.rocketCd=46;coinsA.push(mkCoin(G.W+20,G.gy-150+Math.sin(G.t*3)*40))}}

 /* engeller */
 const db=dinoBox();
 for(let i=obs.length-1;i>=0;i--){
  const o=obs[i];
  if(o.type==='meteor'){
   if(o.state==='warn'){o.t+=dt;if(o.t>.75){o.state='fall';o.ft=0}}
   else if(o.state==='fall'){o.ft+=dt;if(o.ft>=.22){o.state='rock';G.shake=Math.max(G.shake,9);snd('boom');puff(o.x+17,G.gy,22,'#ff8a3d',300,.6,4,420)}}
   else o.x-=adv;
  }else if(o.type==='bird'){o.x-=adv+o.vx*dt}
  else o.x-=adv;
  if(o.x+o.w<-90){obs.splice(i,1);continue}
  if(o.type==='meteor'&&o.state!=='rock')continue;
  const b=obsBox(o),gx=Math.max(db.x-(b.x+b.w),b.x-(db.x+db.w),0),gyy=Math.max(db.y-(b.y+b.h),b.y-(db.y+db.h),0);
  if(gx===0&&gyy===0){hurt();if(G.state!=='playing')return}
  else if(!o.near&&!o.passed&&gx<10&&gyy<10)o.near=true;
  if(!o.passed&&o.x+o.w<dino.x-12){
   o.passed=true;run.streak++;run.maxStreak=Math.max(run.maxStreak,run.streak);
   if(o.type==='bird')run.birds++;

}

/* --- buton bağlantıları --- */
const onClick=(id,fn)=>{const b=$(id);b.addEventListener('click',()=>{audioInit();snd('click');fn();b.blur()})};
onClick('#bPlay',startRun);onClick('#bShop',()=>openPanel('shop'));onClick('#bAch',()=>openPanel('ach'));onClick('#bSet',()=>openPanel('set'));
onClick('#bResume',resumeGame);onClick('#bRestart',startRun);onClick('#bPSet',()=>openPanel('set'));onClick('#bPMenu',toMenu);
onClick('#bAgain',startRun);onClick('#bOShop',()=>openPanel('shop'));onClick('#bShare',share);onClick('#bOMenu',toMenu);
onClick('#pauseBtn',pauseGame);
onClick('#tabSkins',()=>{shopTab='skins';renderShop()});onClick('#tabUps',()=>{shopTab='ups';renderShop()});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{snd('click');closePanel()}));

/* ================= GİRDİ ================= */
const isJumpKey=k=>k==='Space'||k==='ArrowUp'||k==='KeyW',isDownKey=k=>k==='ArrowDown'||k==='KeyS';
addEventListener('keydown',e=>{
 const k=e.code;
 if(isJumpKey(k)||isDownKey(k)||k==='Enter')e.preventDefault();
 if(!e.repeat)document.body.classList.remove('touch');
 audioInit();
 if(isJumpKey(k)||k==='Enter'){
  if(G.state==='playing'){if(isJumpKey(k)){if(!e.repeat)pressJump();src.kj=true}}
  else if(!anyPanelOpen()){
   if(G.state==='menu')startRun();
   else if(G.state==='over'&&performance.now()-G.overT>450)startRun();
   else if(G.state==='paused')resumeGame();
  }
 }else if(isDownKey(k))src.kd=true;
 else if(k==='KeyP'||k==='Escape'){if(anyPanelOpen())closePanel();else togglePause()}
 else if(k==='KeyM'){const on=!(save.set.sfx||save.set.music);save.set.sfx=save.set.music=on;persist();toast(on?'🔊 Ses açık':'🔇 Ses kapalı')}
});
addEventListener('keyup',e=>{if(isJumpKey(e.code))src.kj=false;else if(isDownKey(e.code))src.kd=false});
addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')document.body.classList.add('touch');
 audioInit();if(G.state!=='playing')return;
 e.preventDefault();src.pj.add(e.pointerId);pressJump();
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
const relPtr=e=>{src.pj.delete(e.pointerId)};
cv.addEventListener('pointerup',relPtr);cv.addEventListener('pointercancel',relPtr);
function holdBtn(b,set,down){
 b.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();set.add(e.pointerId);b.classList.add('on');if(down)down();try{b.setPointerCapture(e.pointerId)}catch(_){}});
 const up=e=>{set.delete(e.pointerId);if(!set.size)b.classList.remove('on')};
 b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
}
holdBtn($('#btnDuck'),src.pd);holdBtn($('#btnJump'),src.pj,pressJump);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
addEventListener('blur',pauseGame);

let padStart=false;
function pollPad(){
 const gps=navigator.getGamepads?navigator.getGamepads():null;if(!gps)return;
 for(const p of gps){
  if(!p)continue;
  const a=!!(p.buttons[0]&&p.buttons[0].pressed)||!!(p.buttons[12]&&p.buttons[12].pressed)||p.axes[1]<-.6;
  const d=!!(p.buttons[13]&&p.buttons[13].pressed)||!!(p.buttons[1]&&p.buttons[1].pressed)||p.axes[1]>.6;
  if(a&&!src.gj){
   if(G.state==='playing')pressJump();
   else if(G.state==='menu')startRun();
   else if(G.state==='over'&&performance.now()-G.overT>450)startRun();
   else if(G.state==='paused')resumeGame();
  }
  src.gj=a;src.gd=d;
  const st=!!(p.buttons[9]&&p.buttons[9].pressed);if(st&&!padStart)togglePause();padStart=st;
  return;
 }
}

/* ================= ANA DÖNGÜ ================= */
let lastTs=0;
function frame(ts){
 requestAnimationFrame(frame);
 const rdt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
 pollPad();
 if(G.state==='playing')update(rdt);
 else if(G.state==='dead'||G.state==='over')updateDead(rdt);
 else if(G.state==='menu')menuScene(rdt);
 render();hudUpdate();musicUpdate();
}
resize();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
toMenu();requestAnimationFrame(frame);
})();
</script>
</body>
